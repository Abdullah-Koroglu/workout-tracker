services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=fitcoach
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 20

  nextjs_app:
    image: fitcoach:latest
    build: .
    ports:
      - "3000:3000"
      - "5555:5555"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@postgres:5432/fitcoach?schema=public
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - WS_AUTH_SECRET=${WS_AUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - CRON_SECRET=${CRON_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RTC_PROVIDER=${RTC_PROVIDER}
      - RTC_API_BASE_URL=${RTC_API_BASE_URL}
      - RTC_ROOM_BASE_URL=${RTC_ROOM_BASE_URL}
      - RTC_SIGNALING_URL=${RTC_SIGNALING_URL}
      - RTC_SIGNALING_INTERNAL_URL=${RTC_SIGNALING_INTERNAL_URL}
      - RTC_INTERNAL_API_SECRET=${RTC_INTERNAL_API_SECRET}
      - RTC_TOKEN_TTL_SECONDS=${RTC_TOKEN_TTL_SECONDS}
      - RTC_JOIN_WINDOW_MINUTES=${RTC_JOIN_WINDOW_MINUTES}
      - RTC_CALL_RING_TIMEOUT_SECONDS=${RTC_CALL_RING_TIMEOUT_SECONDS}
      - NEXT_PUBLIC_ENABLE_SERVICE_WORKER=${NEXT_PUBLIC_ENABLE_SERVICE_WORKER:-false}
      - MEDIA_STORAGE_DRIVER=${MEDIA_STORAGE_DRIVER:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-auto}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
      - MEDIA_ALLOW_LOCAL_STORAGE_IN_PRODUCTION=${MEDIA_ALLOW_LOCAL_STORAGE_IN_PRODUCTION:-false}
    entrypoint: ["sh", "-c", "mkdir -p /app/public/uploads/avatars /app/public/uploads/meals /app/public/uploads/checkins /app/public/uploads/transformations && chmod -R 755 /app/public/uploads && node ./scripts/prisma-startup.mjs && ./node_modules/.bin/next start"]

  ws_server:
    image: fitcoach:latest
    command: ["node", "server.js"]
    ports:
      - "3001:3001"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@postgres:5432/fitcoach?schema=public
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - WS_PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - WS_AUTH_SECRET=${WS_AUTH_SECRET}

  # ================================================
  # STAGING ORTAMI - DEMO VERİ İÇİN AYRı DB
  # ================================================
  staging_postgres:
    profiles: ["staging", "staging-tools"]
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=fitcoach_staging
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
    ports:
      - "5434:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach_staging"]
      interval: 5s
      timeout: 5s
      retries: 20

  staging_nextjs_app:
    profiles: ["staging"]
    image: fitcoach:latest
    build: .
    ports:
      - "3002:3000"
    restart: always
    depends_on:
      staging_postgres:
        condition: service_healthy
    volumes:
      - staging_uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL_STAGING}
      - AUTH_SECRET=${NEXTAUTH_SECRET_STAGING}
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL_STAGING}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL_STAGING}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - WS_AUTH_SECRET=${WS_AUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - CRON_SECRET=${CRON_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RTC_PROVIDER=${RTC_PROVIDER}
      - RTC_API_BASE_URL=${RTC_API_BASE_URL}
      - RTC_ROOM_BASE_URL=${RTC_ROOM_BASE_URL}
      - RTC_SIGNALING_URL=${RTC_SIGNALING_URL}
      - RTC_SIGNALING_INTERNAL_URL=${RTC_SIGNALING_INTERNAL_URL}
      - RTC_INTERNAL_API_SECRET=${RTC_INTERNAL_API_SECRET}
      - RTC_TOKEN_TTL_SECONDS=${RTC_TOKEN_TTL_SECONDS}
      - RTC_JOIN_WINDOW_MINUTES=${RTC_JOIN_WINDOW_MINUTES}
      - RTC_CALL_RING_TIMEOUT_SECONDS=${RTC_CALL_RING_TIMEOUT_SECONDS}
      - NEXT_PUBLIC_ENABLE_SERVICE_WORKER=${NEXT_PUBLIC_ENABLE_SERVICE_WORKER:-true}
      - MEDIA_STORAGE_DRIVER=${MEDIA_STORAGE_DRIVER_STAGING:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET_STAGING:-}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION_STAGING:-auto}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT_STAGING:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID_STAGING:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY_STAGING:-}
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL_STAGING:-}
      - MEDIA_ALLOW_LOCAL_STORAGE_IN_PRODUCTION=${MEDIA_ALLOW_LOCAL_STORAGE_IN_PRODUCTION_STAGING:-true}
    entrypoint: ["sh", "-c", "mkdir -p /app/public/uploads/avatars /app/public/uploads/meals /app/public/uploads/checkins /app/public/uploads/transformations && chmod -R 755 /app/public/uploads && node ./scripts/prisma-startup.mjs && ./node_modules/.bin/next start"]

  staging_ws_server:
    profiles: ["staging"]
    image: fitcoach:latest
    command: ["node", "server.js"]
    ports:
      - "3003:3001"
    restart: always
    depends_on:
      staging_postgres:
        condition: service_healthy
    volumes:
      - staging_uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
      - AUTH_SECRET=${NEXTAUTH_SECRET_STAGING}
      - WS_PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - WS_AUTH_SECRET=${WS_AUTH_SECRET}

  staging_seed:
    profiles: ["staging-tools"]
    build:
      context: .
      target: builder
    depends_on:
      staging_postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
    command:
      [
        "sh",
        "-c",
        "node ./scripts/prisma-startup.mjs && npm run db:seed:staging:docker"
      ]
    restart: "no"

  pg_backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db_backups:/backups # Yedeklerin atılacağı ve Rclone'un okuyacağı klasör
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fitcoach
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
      - SCHEDULE=@daily # Her gece yarısı yedekler
      - BACKUP_KEEP_DAYS=7 # Sunucuda sadece son 7 günü tutar, eskileri siler

volumes:
  postgres_data:
  staging_postgres_data:
  uploads_data:
  staging_uploads_data:
