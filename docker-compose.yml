services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=fitcoach
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 20

  nextjs_app:
    image: fitcoach:latest
    build: .
    ports:
      - "3000:3000"
      - "5555:5555"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@postgres:5432/fitcoach?schema=public
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    entrypoint: ["sh", "-c", "mkdir -p /app/public/uploads/avatars /app/public/uploads/meals /app/public/uploads/checkins /app/public/uploads/transformations && chmod -R 755 /app/public/uploads && npx prisma generate --schema=/app/prisma/schema.prisma && npx prisma db push --schema=/app/prisma/schema.prisma && npm run start"]

  ws_server:
    image: fitcoach:latest
    command: ["sh", "-c", "npx prisma generate --schema=/app/prisma/schema.prisma && npm run start:ws"]
    ports:
      - "3001:3001"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@postgres:5432/fitcoach?schema=public
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - WS_PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}

  # ================================================
  # STAGING ORTAMI - DEMO VERİ İÇİN AYRı DB
  # ================================================
  staging_postgres:
    profiles: ["staging", "staging-tools"]
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=fitcoach_staging
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
    ports:
      - "5434:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach_staging"]
      interval: 5s
      timeout: 5s
      retries: 20

  staging_nextjs_app:
    profiles: ["staging"]
    image: fitcoach:latest
    build: .
    ports:
      - "3002:3000"
    restart: always
    depends_on:
      staging_postgres:
        condition: service_healthy
    volumes:
      - staging_uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL_STAGING}
      - AUTH_SECRET=${NEXTAUTH_SECRET_STAGING}
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL_STAGING}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=staging
    entrypoint: ["sh", "-c", "mkdir -p /app/public/uploads/avatars /app/public/uploads/meals /app/public/uploads/checkins /app/public/uploads/transformations && chmod -R 755 /app/public/uploads && npx prisma generate --schema=/app/prisma/schema.prisma && NODE_ENV=staging npx prisma db push --schema=/app/prisma/schema.prisma && npm run start"]

  staging_ws_server:
    profiles: ["staging"]
    image: fitcoach:latest
    command: ["sh", "-c", "npx prisma generate --schema=/app/prisma/schema.prisma && npm run start:ws"]
    ports:
      - "3003:3001"
    restart: always
    depends_on:
      staging_postgres:
        condition: service_healthy
    volumes:
      - staging_uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
      - AUTH_SECRET=${NEXTAUTH_SECRET_STAGING}
      - WS_PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NODE_ENV=staging

  staging_seed:
    profiles: ["staging-tools"]
    build:
      context: .
      target: builder
    depends_on:
      staging_postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fitcoach:fitcoach@staging_postgres:5432/fitcoach_staging?schema=public
      - NODE_ENV=staging
    command: ["npm", "run", "db:seed:staging"]
    restart: "no"

  pg_backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db_backups:/backups # Yedeklerin atılacağı ve Rclone'un okuyacağı klasör
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fitcoach
      - POSTGRES_USER=fitcoach
      - POSTGRES_PASSWORD=fitcoach
      - SCHEDULE=@daily # Her gece yarısı yedekler
      - BACKUP_KEEP_DAYS=7 # Sunucuda sadece son 7 günü tutar, eskileri siler

volumes:
  postgres_data:
  staging_postgres_data:
  uploads_data:
  staging_uploads_data: